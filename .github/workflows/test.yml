name: Tests
on:
  push:
    branches: [main]
  # PR 的单测及离线回归由 ci.yml 的 merge 门禁统一执行。

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run ci
